<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>低空星球离线瓦片包识别 Demo</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://map.qq.com/api/js?v=2.exp&key=YJTBZ-5EBCT-SBAXN-VRUYM-SUXR7-O6FX4&libraries=geometry"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body>
  <div class="page">
    <div class="panel">
      <h1>低空星球离线瓦片包识别 Demo</h1>

      <div class="row">
        <label class="label" for="zipFile">离线包 (zip)</label>
        <input id="zipFile" type="file" accept=".zip" />
      </div>

      <div class="row">
        <label class="label" for="coordType">坐标输入类型</label>
        <select id="coordType">
          <option value="GCJ02" selected>GCJ-02（腾讯）</option>
          <option value="WGS84">WGS84（自动转 GCJ-02）</option>
        </select>
      </div>

      <div class="row">
        <label class="label" for="segmentMeters">导出精度（最大分段，米）</label>
        <input id="segmentMeters" type="number" min="0.1" step="0.1" value="0.5" />
      </div>

      <div class="btns">
        <button id="loadBtn" type="button">加载瓦片包</button>
        <button id="clearBtn" type="button" class="ghost">清空</button>
      </div>

      <div class="btns">
        <button id="exportUomBtn" type="button">导出当前层级 UOM</button>
        <button id="importUomBtn" type="button" class="ghost">导入 KML 并绘制</button>
      </div>

      <div class="row">
        <label class="label" for="kmlFile">KML 文件</label>
        <input id="kmlFile" type="file" accept=".kml,.xml,text/xml,application/vnd.google-earth.kml+xml" />
      </div>

      <div class="row">
        <label class="label" for="coordPayload">KML 文本</label>
        <textarea id="coordPayload" rows="8"
          placeholder="点击“导出当前层级 UOM”后会自动填充；或粘贴 KML / 选择 KML 文件后点击“导入 KML 并绘制”。"></textarea>
      </div>

      <div class="status">
        <div><strong>包状态：</strong><span id="packSummary">未加载</span></div>
        <div><strong>点击识别：</strong><span id="clickResult">未加载</span></div>
        <div><strong id="zoomInfo">当前缩放：Z11</strong></div>
      </div>

      <p class="tips">
        规则：未加载包显示“未加载”；点击后按像素判定，透明(Alpha&lt;=16)=管制区，非透明=适飞区（120M）。
      </p>
    </div>

    <div id="map" class="map"></div>
  </div>

  <script src="./offlineTileApi.js"></script>
  <script src="./app.js"></script>
</body>

</html>
