<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>低空星球离线瓦片双版本对比 Demo</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://map.qq.com/api/js?v=2.exp&key=YJTBZ-5EBCT-SBAXN-VRUYM-SUXR7-O6FX4&libraries=geometry"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body>
  <div class="page">
    <div class="panel">
      <h1>离线瓦片双版本对比 Demo</h1>

      <div class="section">
        <div class="section-title">双版本加载</div>

        <div class="row">
          <label class="label" for="oldZipFile">旧版瓦片包（zip）</label>
          <input id="oldZipFile" type="file" accept=".zip" />
        </div>

        <div class="row">
          <label class="label" for="newTileDir">新版瓦片目录</label>
          <input id="newTileDir" type="file" webkitdirectory directory multiple />
        </div>

        <div class="btns">
          <button id="loadPacksBtn" type="button">加载双版本</button>
          <button id="clearPacksBtn" type="button" class="ghost">清空瓦片</button>
        </div>

        <div class="btns">
          <button id="showOldBtn" type="button">显示旧版</button>
          <button id="showNewBtn" type="button" class="ghost">显示新版</button>
        </div>

        <div class="status">
          <div><strong>旧版：</strong><span id="oldPackSummary">未加载</span></div>
          <div><strong>新版：</strong><span id="newPackSummary">未加载</span></div>
          <div><strong>当前显示：</strong><span id="activeLayerSummary">未显示</span></div>
          <div><strong id="zoomInfo">当前缩放：Z11</strong></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">省域 KML</div>

        <div class="row">
          <label class="checkbox">
            <input id="enableProvinceMask" type="checkbox" checked />
            加载省级 KML 并启用省域遮罩
          </label>
        </div>

        <div class="row two-col">
          <div>
            <label class="label" for="provinceSelect">省份</label>
            <select id="provinceSelect"></select>
          </div>
          <div>
            <label class="label" for="compareZoom">对比缩放</label>
            <select id="compareZoom"></select>
          </div>
        </div>

        <div class="btns">
          <button id="applyProvinceBtn" type="button">应用省域</button>
          <button id="clearProvinceBtn" type="button" class="ghost">清除省域</button>
        </div>

        <div class="status">
          <div><strong>省域状态：</strong><span id="provinceSummary">未加载</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">省内增减评估</div>

        <div class="btns">
          <button id="evaluateBtn" type="button" class="warn">评估省内增减</button>
        </div>

        <div id="compareResult" class="compare-result">加载旧版 zip、新版目录并应用省域后，可评估省内适飞区增减。</div>
      </div>

      <div class="section">
        <div class="section-title">适飞区变化率评估报告</div>

        <div class="row">
          <label class="label" for="reportProvinceSelect">报告省份（可多选）</label>
          <select id="reportProvinceSelect" class="multi-select" multiple size="8"></select>
        </div>

        <div class="btns btns-compact">
          <button id="selectAllReportProvincesBtn" type="button">全选</button>
          <button id="clearReportProvincesBtn" type="button" class="ghost">清空</button>
        </div>

        <div class="btns">
          <button id="generateReportBtn" type="button" class="warn">生成 HTML 报告</button>
        </div>

        <div class="status">
          <div><strong>报告状态：</strong><span id="reportStatus">未生成</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">地图交互</div>

        <div class="row">
          <label class="label" for="coordType">点击识别坐标类型</label>
          <select id="coordType">
            <option value="GCJ02" selected>GCJ-02（腾讯）</option>
            <option value="WGS84">WGS84（自动转 GCJ-02）</option>
          </select>
        </div>

        <div class="row">
          <label class="label" for="searchKeyword">地图搜索</label>
          <div class="search-bar">
            <input id="searchKeyword" type="text" placeholder="输入地名、地址、POI" />
            <button id="searchBtn" type="button" class="search-btn">搜索</button>
            <button id="clearSearchBtn" type="button" class="ghost search-btn">清空搜索</button>
          </div>
        </div>

        <div class="row">
          <div class="search-status">
            <strong>搜索：</strong><span id="searchSummary">未搜索</span>
          </div>
          <div id="searchResults" class="search-results"></div>
        </div>

        <div class="status">
          <div><strong>点击识别：</strong><span id="clickResult">未加载</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">BBOX 框选</div>

        <div class="btns">
          <button id="startBboxSelectBtn" type="button">开始框选</button>
          <button id="clearBboxSelectionBtn" type="button" class="ghost">清除框选</button>
        </div>

        <div class="btns btns-compact">
          <button id="copyBboxBtn" type="button" class="ghost">复制 BBOX</button>
        </div>

        <div class="row">
          <label class="label" for="bboxOutput">BBOX（minLng,minLat,maxLng,maxLat）</label>
          <textarea
            id="bboxOutput"
            rows="3"
            readonly
            placeholder="点击“开始框选”后，在地图上拖拽一个矩形区域。"
          ></textarea>
        </div>

        <div class="status">
          <div><strong>BBOX：</strong><span id="bboxSummary">未框选</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">KML 导入导出</div>

        <div class="row">
          <label class="label" for="segmentMeters">导出精度（最大分段，米）</label>
          <input id="segmentMeters" type="number" min="0.1" step="0.1" value="0.5" />
        </div>

        <div class="btns">
          <button id="exportUomBtn" type="button">导出当前层级 UOM</button>
          <button id="importUomBtn" type="button" class="ghost">导入 KML 并绘制</button>
        </div>

        <div class="row">
          <label class="label" for="kmlFile">KML 文件</label>
          <input id="kmlFile" type="file" accept=".kml,.xml,text/xml,application/vnd.google-earth.kml+xml" />
        </div>

        <div class="row">
          <label class="label" for="coordPayload">KML 文本</label>
          <textarea id="coordPayload" rows="8"
            placeholder="点击“导出当前层级 UOM”后会自动填充；或粘贴 KML / 选择 KML 文件后点击“导入 KML 并绘制”。标准 KML 默认按 WGS84 导入。"></textarea>
        </div>
      </div>

      <p class="tips">
        评估规则：省域内有颜色的像素视为适飞区。旧版与新版在同一缩放级别下按像素对比，得到新增、减少和重合结果；面积为近似值。为避免内存占用过大，省内增减评估和报告仅支持 Z8 及以下。
      </p>
    </div>

    <div id="map" class="map"></div>
  </div>

  <script src="./offlineTileApi.js"></script>
  <script src="./provinceData.js"></script>
  <script src="./app.js"></script>
</body>

</html>
